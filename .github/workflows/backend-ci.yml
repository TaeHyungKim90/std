# 백엔드: PR·푸시 시 Lint + Test 자동 검증
name: Backend CI

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
      - edited
    paths:
      - 'backend/**'
      - 'pyrightconfig.json'
      - '.github/workflows/backend-ci.yml'
  push:
    branches:
      - master
    paths:
      - 'backend/**'
      - 'pyrightconfig.json'
      - '.github/workflows/backend-ci.yml'
    tags:
      - 'v*.*.*'

defaults:
  run:
    working-directory: backend

jobs:
  linter:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Restore uv cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('backend/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: |
          uv sync --locked --group dev
          echo "$GITHUB_WORKSPACE/backend/.venv/bin" >> $GITHUB_PATH

      - name: Run lint
        run: |
          uv run python -m compileall app tests
          cd ..
          uv run --project backend pyright

  tester:
    name: Test
    needs: linter
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Restore uv cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('backend/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: |
          uv sync --locked --group dev
          echo "$GITHUB_WORKSPACE/backend/.venv/bin" >> $GITHUB_PATH

      - name: Run tests
        run: uv run pytest
        env:
          CI: true
