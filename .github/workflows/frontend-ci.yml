# 프론트엔드: PR·푸시 시 Lint + Test 자동 검증
name: Frontend CI

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
      - edited
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  push:
    branches:
      - master
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
    tags:
      - 'v*.*.*'

defaults:
  run:
    working-directory: frontend

jobs:
  linter:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Restore npm cache
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: |
          npm ci --cache ~/.npm
          echo "$GITHUB_WORKSPACE/frontend/node_modules/.bin" >> $GITHUB_PATH

      - name: Run lint
        run: npm run lint

  tester:
    name: Test
    needs: linter
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Restore npm cache
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: |
          npm ci --cache ~/.npm
          echo "$GITHUB_WORKSPACE/frontend/node_modules/.bin" >> $GITHUB_PATH

      - name: Run tests
        run: npm test -- --watchAll=false
        env:
          CI: true
